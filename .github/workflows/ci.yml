name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server --include=dev

      - name: Run server tests
        run: npm test --prefix server

      - name: Build server
        run: npm run build --prefix server

      - name: Audit production server dependencies
        run: npm audit --prefix server --omit=dev --audit-level=high

      - name: Verify PWA runtime config build
        run: npm run vercel-build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Run Expo integration tests
        run: npm test --prefix mobile

      - name: Typecheck Expo client
        run: npm run typecheck --prefix mobile

      - name: Validate Expo dependency compatibility
        working-directory: mobile
        run: npx expo-doctor

      - name: Reject critical production dependency advisories
        run: npm audit --prefix mobile --omit=dev --audit-level=critical

  cross-repository-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: dugoutcall

      - uses: actions/checkout@v4
        with:
          repository: chrisbaso/diamond-scout-assistant
          ref: integration/dugoutcall-live
          path: diamond-scout-assistant

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dugoutcall/server/package-lock.json
            dugoutcall/mobile/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: diamond-scout-assistant/requirements-ci.txt

      - name: Install integration dependencies
        run: |
          python -m pip install -r diamond-scout-assistant/requirements-ci.txt
          npm ci --prefix dugoutcall/server
          npm ci --prefix dugoutcall/mobile

      - name: Run Diamond × DugoutCall E2E
        working-directory: dugoutcall
        env:
          DIAMOND_REPO: ${{ github.workspace }}/diamond-scout-assistant
        run: npm run test:e2e
