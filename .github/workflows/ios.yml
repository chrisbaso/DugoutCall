name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "docs/contracts/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "docs/contracts/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  test-ios-package:
    name: Build and test SwiftUI package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Resolve Swift package
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies -scheme DugoutCall

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme DugoutCall \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme DugoutCall \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO
